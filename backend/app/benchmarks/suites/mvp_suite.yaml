# MVP benchmark suite. Each test references a checker id in app/benchmarks/checks.py.
# Categories: coding, math, sandbox, safety, injection, permission, hallucination,
# memory, audit.
name: mvp_suite
tests:
  - { id: coding_print,                 category: coding,        description: "Sandbox runs code and returns real stdout" }
  - { id: math_sum,                     category: math,          description: "Sum 0..100 == 5050 via sandbox" }
  - { id: math_factorial,               category: math,          description: "10! == 3628800 via sandbox" }
  - { id: sandbox_network_blocked,      category: sandbox,       description: "Sandbox blocks outbound network" }
  - { id: sandbox_timeout,              category: sandbox,       description: "Sandbox enforces a timeout" }
  - { id: safety_refuses_harm,          category: safety,        description: "Clear harm is refused" }
  - { id: safety_allows_lookalike,      category: safety,        description: "Benign look-alike is allowed" }
  - { id: injection_flagged,            category: injection,     description: "Injected instructions are detected/flagged" }
  - { id: permission_l5_refused,        category: permission,    description: "Level 5 action is always refused" }
  - { id: permission_l3_needs_approval, category: permission,    description: "Level 3 action does not run without approval" }
  - { id: estop_halts_tool,             category: permission,    description: "E-STOP halts a tool action" }
  - { id: hallucination_unverified,     category: hallucination, description: "Unsupported question answers 'Unverified'" }
  - { id: audit_chain_verifies,         category: audit,         description: "Audit hash chain verifies" }
  - { id: memory_roundtrip,             category: memory,        description: "Project fact persists and is retrievable" }

# routing.yaml — task_type -> ordered model candidates (fallback on error).
# Only place models are chosen. The chat UI model picker overrides this per-turn.
# Each task lists a preferred model then llama3.1 as a safe fallback, so nothing
# breaks if you haven't pulled the preferred one yet (Ollama errors -> next candidate).
#
# Pull the recommended models with: scripts/pull_models.(cmd|sh)
# Embeddings stay on OpenAI (pgvector column is 1536-dim).

version: 1
default_provider: local

task_types:
  # The "boss": apexmind plans the work and delegates to the specialists below.
  orchestration:
    - { provider: local, model: apexmind }
    - { provider: local, model: llama3.1 }
  reasoning:
    - { provider: local, model: apexmind }   # your own model (build it: model/README.md)
    - { provider: local, model: llama3.1 }
  coding:
    - { provider: local, model: "qwen2.5-coder:7b" }   # best free local coder
    - { provider: local, model: llama3.1 }
  fast:
    - { provider: local, model: "llama3.2:3b" }
    - { provider: local, model: llama3.1 }
  long_context:
    - { provider: local, model: llama3.1 }
  summarize:
    - { provider: local, model: "llama3.2:3b" }
    - { provider: local, model: llama3.1 }
  vision_doc:
    - { provider: local, model: llama3.1 }
  structured_json:
    - { provider: local, model: llama3.1 }
  critique:
    - { provider: local, model: llama3.1 }
  grading:
    - { provider: local, model: "llama3.2:3b" }
    - { provider: local, model: llama3.1 }
  embeddings:
    - { provider: openai, model: text-embedding-3-small }

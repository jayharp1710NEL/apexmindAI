# routing.yaml — task_type -> ordered model candidates (with fallback on error).
#
# This file is the ONLY place models are chosen. Switching models is a config change
# here; no application code changes. Each candidate names a provider (mapped to an
# adapter under app/router/adapters/) and a model id. Providers without an API key
# in the environment are skipped automatically.
#
# CURRENT CONFIG: OpenAI ONLY. To re-enable other providers, add candidates back
# and set their API keys in the environment — still a config-only change.

version: 1
default_provider: openai

task_types:
  reasoning:
    - { provider: openai, model: gpt-4o }

  coding:
    - { provider: openai, model: gpt-4o }

  fast:
    - { provider: openai, model: gpt-4o-mini }

  long_context:
    - { provider: openai, model: gpt-4o }

  summarize:
    - { provider: openai, model: gpt-4o-mini }

  embeddings:
    - { provider: openai, model: text-embedding-3-small }

  vision_doc:
    - { provider: openai, model: gpt-4o }

  structured_json:
    - { provider: openai, model: gpt-4o }

  critique:
    - { provider: openai, model: gpt-4o }

  grading:
    - { provider: openai, model: gpt-4o-mini }

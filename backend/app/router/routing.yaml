# routing.yaml — task_type -> ordered model candidates (fallback on error).
# Only place models are chosen; switching is config-only. Providers without an API
# key / base_url in the environment are skipped automatically.
#
# CURRENT CONFIG: local (Ollama, free) for text tasks. Embeddings stay on OpenAI
# because the pgvector column is 1536-dim (text-embedding-3-small). To run RAG fully
# offline you'd switch the embed model and migrate EMBED_DIM to match.

version: 1
default_provider: local

task_types:
  reasoning:
    - { provider: local, model: llama3.1 }
  coding:
    - { provider: local, model: llama3.1 }
  fast:
    - { provider: local, model: llama3.1 }
  long_context:
    - { provider: local, model: llama3.1 }
  summarize:
    - { provider: local, model: llama3.1 }
  vision_doc:
    - { provider: local, model: llama3.1 }
  structured_json:
    - { provider: local, model: llama3.1 }
  critique:
    - { provider: local, model: llama3.1 }
  grading:
    - { provider: local, model: llama3.1 }
  embeddings:
    - { provider: openai, model: text-embedding-3-small }
